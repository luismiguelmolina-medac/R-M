<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="query.js"></script>
    <title>Document</title>
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
        }

        .left-column {
            height: 100vh;
            border-right: 1px solid #ddd;
            padding: 20px;
            position: relative;
        }

        .left-column input {
            margin-bottom: 10px;
            height: 40px;
        }

        .item-list {
            overflow-y: auto;
            height: calc(100% - 50px);
        }

        .item-list img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            margin-right: 10px;
            border-radius: 5px;
        }

        .item {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .gallery {
            padding: 1rem;
        }

        .gallery img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        #buscar {
            padding: 10px;
            margin-top: -16px;
            position: absolute;
            width: calc(100% - 40px);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            <!-- Columna izquierda -->
            <div class="col-12 col-md-3 left-column">
                <input type="text" class="form-control mb-3" placeholder="Buscar...">
                <div id="buscar" class="card" style="display: none;"></div>
                <div class="item-list">

                </div>
            </div>

            <!-- Columna derecha -->
            <div class="col-12 col-md-9 gallery d-flex justify-content-center">
                <div class="row g-3">
                    <div class="col-4"><img src="https://via.placeholder.com/300x200" alt="Imagen 1"></div>
                    <div class="col-4"><img src="https://via.placeholder.com/300x200" alt="Imagen 2"></div>
                    <div class="col-4"><img src="https://via.placeholder.com/300x200" alt="Imagen 3"></div>
                    <div class="col-4"><img src="https://via.placeholder.com/300x200" alt="Imagen 4"></div>
                    <div class="col-4"><img src="https://via.placeholder.com/300x200" alt="Imagen 5"></div>
                    <div class="col-4"><img src="https://via.placeholder.com/300x200" alt="Imagen 6"></div>
                    <div class="col-4"><img src="https://via.placeholder.com/300x200" alt="Imagen 7"></div>
                    <div class="col-4"><img src="https://via.placeholder.com/300x200" alt="Imagen 8"></div>
                    <div class="col-4"><img src="https://via.placeholder.com/300x200" alt="Imagen 9"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
